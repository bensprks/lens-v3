name: ci

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install ZKsync's Foundry
        uses: dutterbutter/foundry-zksync-toolchain@v1
      - name: Output Foundry Version
        run: forge --version
      - name: Install Dependencies
        run: yarn
      - name: Compile Project
        run: npx hardhat compile
      - name: Verify Hashed Constants
        run: node verify_hashed_constants.js
      - name: Run Tests
        run: forge test -vvv
      - name: Run Tests - ZKsync Environment
        run: DAPP_TEST_FUZZ_RUNS=5 forge test --zksync -vvv --suppress-warnings assemblycreate

  monad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      # Monad execution (monad-revm) ships with Foundry >= 1.8.0, not with the ZKsync fork used above.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Output Foundry Version
        run: forge --version
      - name: Install Dependencies
        run: yarn
      # The `monad` profile implies `--network monad` and uses the compiler settings of Monad deployments.
      - name: Check Contract Sizes - Monad Limits
        run: FOUNDRY_PROFILE=monad forge build --sizes
      - name: Run Tests - Monad Environment
        run: FOUNDRY_PROFILE=monad forge test -vvv
